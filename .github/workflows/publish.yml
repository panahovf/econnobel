# Publishes the poll page (the site/ folder) to GitHub Pages: panahovf.github.io/econnobel/
#
# Runs:
#   - whenever something is pushed to main,
#   - by hand: Actions tab -> "Publish the page" -> "Run workflow".
#
# Each run rebuilds the list (data/05_combine.ipynb) and publishes the page. Nothing is committed back.
# Until the prize was announced it also ran every 4 hours and downloaded fresh Kalshi odds (data/03_kalshi.ipynb)
# first. Both stopped after 12 October: Kalshi's markets have settled, and their prices now read as 50% for everyone.
# Steps 1, 2, 3 and 4 (RePEc, their profiles, Kalshi, past winners) are run by hand when needed.

name: Publish the page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the notebooks need
        run: pip install pandas requests beautifulsoup4 nbconvert ipykernel

      - name: Rebuild the list for the page (step 5)
        working-directory: data
        run: jupyter nbconvert --to notebook --execute 05_combine.ipynb --output-dir /tmp/runs --ExecutePreprocessor.timeout=600

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
